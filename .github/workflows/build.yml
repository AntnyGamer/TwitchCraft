name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 25 for Minecraft 26.3 diagnostic
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Diagnose Minecraft 26.3 startup commands
        shell: pwsh
        run: |
          java -version
          $dir = Join-Path $env:RUNNER_TEMP "twitchcraft-mc263-diagnostic"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar" -OutFile (Join-Path $dir "server.jar")
          Set-Content -Path (Join-Path $dir "eula.txt") -Value "eula=true" -Encoding ascii
          @"
          online-mode=false
          max-players=1
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          "@ | Set-Content -Path (Join-Path $dir "server.properties") -Encoding ascii

          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = "java"
          $info.Arguments = "-Xms512M -Xmx1G -jar server.jar nogui"
          $info.WorkingDirectory = $dir
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true

          $output = [System.Collections.Concurrent.ConcurrentQueue[string]]::new()
          $errors = [System.Collections.Concurrent.ConcurrentQueue[string]]::new()
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          $process.add_OutputDataReceived({ param($sender, $e) if ($null -ne $e.Data) { $output.Enqueue($e.Data) } })
          $process.add_ErrorDataReceived({ param($sender, $e) if ($null -ne $e.Data) { $errors.Enqueue($e.Data) } })
          if (-not $process.Start()) { throw "Could not start Minecraft 26.3 server." }
          $process.BeginOutputReadLine()
          $process.BeginErrorReadLine()

          $deadline = [DateTime]::UtcNow.AddMinutes(4)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline -and -not ($output.ToArray() -match 'Done \(')) {
            Start-Sleep -Milliseconds 100
          }
          if (-not ($output.ToArray() -match 'Done \(')) {
            throw "Minecraft 26.3 did not become ready. STDERR: $($errors.ToArray() -join ' | ')"
          }

          $commands = @(
            'data modify storage twitchcraft:probe marker set value "tc_probe_test"',
            'data get storage twitchcraft:probe marker',
            'scoreboard objectives remove tc_playerlist',
            'scoreboard objectives remove tc_health',
            'data get entity @a[name="NoSuchPlayer",limit=1] attributes',
            'data get entity @a[name="NoSuchPlayer",limit=1] playerGameType',
            'scoreboard objectives add tc_deaths deathCount',
            'gamerule minecraft:pvp false'
          )

          for ($i = 0; $i -lt $commands.Count; $i++) {
            $command = $commands[$i]
            $marker = "tc_diag_$i"
            $before = $output.Count
            Write-Host "COMMAND> $command"
            $process.StandardInput.WriteLine($command)
            $process.StandardInput.WriteLine("say $marker")
            $process.StandardInput.Flush()
            $commandDeadline = [DateTime]::UtcNow.AddSeconds(5)
            while ([DateTime]::UtcNow -lt $commandDeadline -and -not ($output.ToArray() -match $marker)) {
              Start-Sleep -Milliseconds 50
            }
            $snapshot = $output.ToArray()
            for ($j = $before; $j -lt $snapshot.Length; $j++) { Write-Host "MC> $($snapshot[$j])" }
          }

          $process.StandardInput.WriteLine("stop")
          $process.StandardInput.Flush()
          $process.WaitForExit(30000) | Out-Null

      - name: Restore
        run: dotnet restore TwitchCraft.slnx

      - name: Verify formatting
        run: dotnet format TwitchCraft.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TwitchCraft.slnx -c Release --no-restore

      - name: Test
        working-directory: TwitchCraft.Tests
        run: dotnet test --project TwitchCraft.Tests.csproj -c Release --no-build --results-directory ..\TestResults --coverlet --coverlet-output-format cobertura

      - name: Enforce code coverage
        run: |
          $report = Get-ChildItem "TestResults\coverage.cobertura.*.xml" | Select-Object -First 1
          if (-not $report) { throw "Coverage report not found." }
          [xml]$coverage = Get-Content $report.FullName
          $lineCoverage = [double]$coverage.coverage.'line-rate' * 100
          Write-Host "Line coverage: $($lineCoverage.ToString('0.00'))%"
          if ($lineCoverage -lt 10) { throw "Line coverage fell below 10%." }

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: TestResults/coverage.cobertura.*.xml
          if-no-files-found: error
