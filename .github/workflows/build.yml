name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: TEMP set up Java 25 for datapack diagnostic
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Java 25 for datapack diagnostic
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: TEMP diagnose 26.3 datapack restart load
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tc-datapack-restart"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar" -OutFile (Join-Path $dir "server.jar")
          Set-Content (Join-Path $dir "eula.txt") "eula=true"
          @"
          online-mode=false
          max-players=1
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          "@ | Set-Content (Join-Path $dir "server.properties")

          $pack = Join-Path $dir "world/datapacks/locateplayers"
          New-Item -ItemType Directory -Force -Path (Join-Path $pack "data/locateplayers/function") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pack "data/minecraft/tags/function") | Out-Null
          @'
          {
            "pack": {
              "min_format": [121, 0],
              "max_format": [121, 0],
              "description": "Locate players command for TwitchCraft"
            }
          }
          '@ | Set-Content (Join-Path $pack "pack.mcmeta")
          @'
          scoreboard objectives add locateplayers trigger
          scoreboard objectives add lp_math dummy
          '@ | Set-Content (Join-Path $pack "data/locateplayers/function/load.mcfunction")
          @'
          {
            "values": ["locateplayers:load"]
          }
          '@ | Set-Content (Join-Path $pack "data/minecraft/tags/function/load.json")

          function Start-MC([string] $label) {
            Write-Host "=== $label ==="
            $info = [System.Diagnostics.ProcessStartInfo]::new()
            $info.FileName = "java"
            $info.Arguments = "-Xms512M -Xmx1G -jar server.jar nogui"
            $info.WorkingDirectory = $dir
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo = $info
            if (-not $p.Start()) { throw "Could not start Minecraft." }
            do {
              $line = $p.StandardOutput.ReadLine()
              if ($null -eq $line) { throw "Minecraft exited before ready." }
              Write-Host "MC> $line"
            } until ($line -match 'Done \(')
            $p.StandardInput.WriteLine("stop")
            $p.StandardInput.Flush()
            $p.WaitForExit(30000) | Out-Null
          }

          Start-MC "FIRST START"
          Start-MC "SECOND START"

      - name: Restore
        run: dotnet restore TwitchCraft.slnx

      - name: Verify formatting
        run: dotnet format TwitchCraft.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TwitchCraft.slnx -c Release --no-restore

      - name: Test
        working-directory: TwitchCraft.Tests
        run: dotnet test --project TwitchCraft.Tests.csproj -c Release --no-build --results-directory ..\TestResults --coverlet --coverlet-output-format cobertura

      - name: Enforce code coverage
        run: |
          $report = Get-ChildItem "TestResults\coverage.cobertura.*.xml" | Select-Object -First 1
          if (-not $report) { throw "Coverage report not found." }
          [xml]$coverage = Get-Content $report.FullName
          $lineCoverage = [double]$coverage.coverage.'line-rate' * 100
          Write-Host "Line coverage: $($lineCoverage.ToString('0.00'))%"
          if ($lineCoverage -lt 10) { throw "Line coverage fell below 10%." }

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: TestResults/coverage.cobertura.*.xml
          if-no-files-found: error
