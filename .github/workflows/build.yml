name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: TEMP set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: TEMP diagnose exact Minecraft 26.3 probe batches
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tc-probe-batch"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar" -OutFile (Join-Path $dir "server.jar")
          Set-Content (Join-Path $dir "eula.txt") "eula=true"
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = New-Object System.Diagnostics.ProcessStartInfo
          $p.StartInfo.FileName = "java"
          $p.StartInfo.Arguments = "-Xms512M -Xmx1G -jar server.jar nogui"
          $p.StartInfo.WorkingDirectory = $dir
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardInput = $true
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardError = $true
          [void]$p.Start()
          do { $line = $p.StandardOutput.ReadLine(); Write-Host "MC> $line" } until ($line -match 'Done \(')
          $m1 = "tc_probe_0123456789abcdef0123456789abcdef_1"
          $m2 = "tc_probe_0123456789abcdef0123456789abcdef_2"
          $batch = "list`r`ndata modify storage twitchcraft:probe marker set value `"$m1`"`r`ndata get storage twitchcraft:probe marker`r`n" +
                   "scoreboard objectives add tc_deaths deathCount`r`ndata modify storage twitchcraft:probe marker set value `"$m2`"`r`ndata get storage twitchcraft:probe marker`r`n" +
                   "gamerule minecraft:pvp false`r`nsay tc_diag_done`r`n"
          $p.StandardInput.Write($batch)
          $p.StandardInput.Flush()
          do { $line = $p.StandardOutput.ReadLine(); Write-Host "MC> $line" } until ($line -match 'tc_diag_done')
          $p.StandardInput.WriteLine("stop")
          $p.StandardInput.Flush()
          $p.WaitForExit(30000) | Out-Null

      - name: Set up Java 25 for Minecraft 26.3 diagnostic
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Diagnose Minecraft 26.3 player-style recovery commands
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "twitchcraft-mc263-entity-diagnostic"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar" -OutFile (Join-Path $dir "server.jar")
          Set-Content -Path (Join-Path $dir "eula.txt") -Value "eula=true" -Encoding ascii
          @"
          online-mode=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          "@ | Set-Content -Path (Join-Path $dir "server.properties") -Encoding ascii

          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = "java"
          $info.Arguments = "-DMC_DEBUG_VERBOSE_COMMAND_ERRORS=true -Xms512M -Xmx1G -jar server.jar nogui"
          $info.WorkingDirectory = $dir
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw "Could not start Minecraft 26.3 server." }

          while (-not $process.HasExited) {
            $line = $process.StandardOutput.ReadLine()
            if ($null -eq $line) { throw "Minecraft exited before ready." }
            Write-Host "MC> $line"
            if ($line -match 'Done \(') { break }
          }

          $commands = @(
            'execute in minecraft:overworld run summon minecraft:zombie 0 100 0 {PersistenceRequired:1b,Tags:["tcdiag"]}',
            'data get entity @e[type=minecraft:zombie,tag=tcdiag,limit=1] attributes',
            'execute as @e[type=minecraft:zombie,tag=tcdiag,limit=1] run attribute @s minecraft:scale base set 1',
            'execute as @e[type=minecraft:zombie,tag=tcdiag,limit=1] run attribute @s minecraft:max_health modifier remove twitchcraft:heart_0123456789abcdef0123456789abcdef',
            'execute as @e[type=minecraft:zombie,tag=tcdiag,limit=1] run attribute @s minecraft:max_health modifier add twitchcraft:heart_0123456789abcdef0123456789abcdef 2 add_value',
            'data get entity @e[type=minecraft:zombie,tag=tcdiag,limit=1] attributes',
            'execute as @e[type=minecraft:zombie,tag=tcdiag,limit=1] run attribute @s minecraft:max_health modifier remove twitchcraft:heart_0123456789abcdef0123456789abcdef',
            'data get entity @e[type=minecraft:zombie,tag=tcdiag,limit=1] playerGameType'
          )

          for ($i = 0; $i -lt $commands.Count; $i++) {
            $marker = "tc_diag_$i"
            Write-Host "COMMAND> $($commands[$i])"
            $process.StandardInput.WriteLine($commands[$i])
            $process.StandardInput.WriteLine("say $marker")
            $process.StandardInput.Flush()
            do {
              $line = $process.StandardOutput.ReadLine()
              if ($null -eq $line) { throw "Minecraft exited during command $i." }
              Write-Host "MC> $line"
            } while ($line -notmatch $marker)
          }

          $process.StandardInput.WriteLine("stop")
          $process.StandardInput.Flush()
          $process.WaitForExit(30000) | Out-Null

      - name: Restore
        run: dotnet restore TwitchCraft.slnx

      - name: Verify formatting
        run: dotnet format TwitchCraft.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TwitchCraft.slnx -c Release --no-restore

      - name: Test
        working-directory: TwitchCraft.Tests
        run: dotnet test --project TwitchCraft.Tests.csproj -c Release --no-build --results-directory ..\TestResults --coverlet --coverlet-output-format cobertura

      - name: Enforce code coverage
        run: |
          $report = Get-ChildItem "TestResults\coverage.cobertura.*.xml" | Select-Object -First 1
          if (-not $report) { throw "Coverage report not found." }
          [xml]$coverage = Get-Content $report.FullName
          $lineCoverage = [double]$coverage.coverage.'line-rate' * 100
          Write-Host "Line coverage: $($lineCoverage.ToString('0.00'))%"
          if ($lineCoverage -lt 10) { throw "Line coverage fell below 10%." }

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: TestResults/coverage.cobertura.*.xml
          if-no-files-found: error
