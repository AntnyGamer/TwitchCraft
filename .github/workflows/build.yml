name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TwitchCraft.slnx

      - name: Build
        run: dotnet build TwitchCraft.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TwitchCraft.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
