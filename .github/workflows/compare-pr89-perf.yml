name: Temporary PR89 performance comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout baseline (merged PR 89)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91a3981e87d3b178d9a5d8c59a73b8379141194a
          path: baseline
          persist-credentials: false
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"
      - name: Create identical standalone benchmarks for both versions
        shell: pwsh
        run: |
          $project = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <UseWPF>true</UseWPF>
              <AssemblyName>TwitchCraft.Tests</AssemblyName>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../TwitchCraft_SOURCE/TwitchCraft.csproj" />
            </ItemGroup>
          </Project>
          '@
          $program = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          using TwitchCraft_V1;
          using TwitchCraft_V1.Setup;
          using TwitchCraft_V1.Frames;

          internal static class Program
          {
              private static void Measure(string name, int runs, Action action)
              {
                  GC.Collect();
                  GC.WaitForPendingFinalizers();
                  GC.Collect();
                  long bytes = GC.GetAllocatedBytesForCurrentThread();
                  long start = Stopwatch.GetTimestamp();
                  for (int i = 0; i < runs; i++) action();
                  long elapsed = Stopwatch.GetTimestamp() - start;
                  Console.WriteLine($"BENCH|{name}|{runs}|{elapsed * 1000.0 / Stopwatch.Frequency:F4}|{GC.GetAllocatedBytesForCurrentThread() - bytes}");
              }

              [STAThread]
              private static void Main()
              {
                  var cfg = new TwitchCraftConfig();
                  for (int i = 0; i < 24; i++)
                      cfg.Settings.CommandCustomizations[$"command{i}"] = new CommandCustomization { CooldownSeconds = i };
                  for (int i = 0; i < 1000; i++) _ = ConfigurationStore.Clone(cfg);
                  Measure("ConfigClone", 40000, () => GC.KeepAlive(ConfigurationStore.Clone(cfg)));

                  var message = new IRCMessage();
                  string line = "@badge-info=;badges=moderator/1;color=#FF0000;display-name=Viewer;id=abc123;mod=1;subscriber=0;turbo=0;user-id=42 :viewer!viewer@viewer.tmi.twitch.tv PRIVMSG #channel :Hello world!";
                  for (int i = 0; i < 1000; i++) message.TryParse(line);
                  Measure("IRCParse", 250000, () => message.TryParse(line));

                  var dir = Path.Combine(Path.GetTempPath(), "TC_perf_" + Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(dir);
                  var db = Path.Combine(dir, "viewer_tokens.db");
                  var tokens = new TokenService(db, static () => 0);
                  try
                  {
                      tokens.Load(0);
                      tokens.Award("bettor", 50000);
                      tokens.Award("viewer", 50000);
                      Measure("TokenBalanceRead", 120000, () => GC.KeepAlive(tokens.GetBalance("viewer")));
                      Measure("NormalTokenAward", 500, () => tokens.Award("viewer", 1));
                      var minigameMethod = typeof(TokenService).GetMethod("TrySpendForMinigameBet", BindingFlags.Instance | BindingFlags.NonPublic)
                          ?? typeof(TokenService).GetMethod("TrySpend", BindingFlags.Instance | BindingFlags.Public)!;
                      object[] stake = ["bettor", 1];
                      Measure("BetSpend", 500, () => GC.KeepAlive(minigameMethod.Invoke(tokens, stake)));
                  }
                  finally
                  {
                      tokens.Close();
                  }

                  for (int i = 0; i < 5; i++) GC.KeepAlive(new Help());
                  Measure("HelpPageCreate", 45, () => GC.KeepAlive(new Help()));
              }
          }
          '@
          foreach ($folder in @('baseline', 'candidate')) {
            New-Item -ItemType Directory -Path "$folder/PerfCompare" -Force | Out-Null
            Set-Content -Path "$folder/PerfCompare/PerfCompare.csproj" -Value $project
            Set-Content -Path "$folder/PerfCompare/Program.cs" -Value $program
            dotnet restore "$folder/PerfCompare/PerfCompare.csproj"
            if ($LASTEXITCODE -ne 0) { throw "restore $folder failed" }
            dotnet build "$folder/PerfCompare/PerfCompare.csproj" -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "build $folder failed" }
          }
      - name: Run paired benchmarks on same runner
        shell: pwsh
        run: |
          foreach ($iteration in 1..3) {
            foreach ($version in @('baseline', 'candidate')) {
              Write-Host "PERF_RUN $iteration $version"
              dotnet run --project "$version/PerfCompare/PerfCompare.csproj" -c Release --no-build --no-restore
              if ($LASTEXITCODE -ne 0) { throw "bench $version failed" }
            }
          }
