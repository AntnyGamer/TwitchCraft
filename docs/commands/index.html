<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10151b">
  <meta name="description" content="Browse TwitchCraft Minecraft and Twitch chat commands. Search syntax, default token costs, permissions and targeting, then copy commands for chat.">
  <title>Command Library | TwitchCraft</title>
  <link rel="icon" type="image/png" href="./server-icon.png">
  <link rel="stylesheet" href="../command-browser.css?v=20261013-cleanup">
  <script defer src="../command-browser.js?v=20261013-sort">
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to commands</a>
  <div class="site">
    <header class="topbar">
      <a class="brand" href="https://github.com/AntnyGamer/TwitchCraft" aria-label="TwitchCraft on GitHub">
        <img class="brand-logo" src="./server-icon.png" width="40" height="40" alt="">
        <span class="brand-name">TWITCH<span>CRAFT</span></span>
      </a>
      <nav class="top-links" aria-label="Project links">
        <a href="https://github.com/AntnyGamer/TwitchCraft/releases/latest">Download app <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/AntnyGamer/TwitchCraft">Source <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-content">
          <p class="eyebrow">TWITCHCRAFT / COMMAND REFERENCE</p>
          <h1 id="page-title">TwitchCraft commands</h1>
          <p class="lead">Browse the commands viewers can use in chat. Check the cost, find the syntax, and copy a command when you need it.</p>
          <div class="hero-actions">
            <a class="primary-link" href="#catalog">Browse commands ↓</a>
            <a class="secondary-link" href="https://github.com/AntnyGamer/TwitchCraft/blob/main/docs/COMMANDS.md">Technical documentation ↗</a>
          </div>
        </div>
        <div class="hero-art" aria-label="Example commands in Twitch chat">
          <div class="console-window">
            <div class="console-top">EXAMPLE CHAT COMMANDS</div>
            <div class="console-lines">
              <div><span class="console-user">antny_is_epic</span><span class="console-command">!heal</span></div>
              <div><span class="console-user">NickChunk</span><span class="console-command">!lightning</span></div>
              <div><span class="console-user">Joelmath0</span><span class="console-command">!mob</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="summary-strip" aria-label="Command counts">
        <div class="summary-item"><strong id="total-count">—</strong><span>Built-in commands</span></div>
        <div class="summary-item"><strong id="gameplay-count">—</strong><span>Gameplay</span></div>
        <div class="summary-item"><strong id="minigame-count">—</strong><span>Minigames</span></div>
        <div class="summary-item"><strong id="utility-count">—</strong><span>Utility</span></div>
        <div class="summary-item"><strong id="streamer-count">—</strong><span>Streamer commands</span></div>
      </section>

      <section class="browser" id="catalog" aria-labelledby="catalog-heading">
        <div class="section-intro">
          <div>
            <h2 id="catalog-heading">Command list</h2>
            <p>Search or filter the commands below. Prices are based on TwitchCraft's default settings.</p>
          </div>
        </div>
        <div class="browser-panel">
          <div class="toolbar">
            <label class="search-box" for="command-search">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg>
              <span class="visually-hidden">Search commands</span>
              <input id="command-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search commands, e.g. lightning, tokens…">
              <kbd>/</kbd>
            </label>
            <label class="free-toggle" for="free-only"><input type="checkbox" id="free-only"><span>Free only</span></label>
            <label class="toolbar-select" for="price-multiplier">
              <span>Multiplier</span>
              <select id="price-multiplier" aria-describedby="multiplier-note">
                <option value="0">0×</option>
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1× (default)</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
                <option value="3">3×</option>
              </select>
            </label>
            <label class="toolbar-select" for="command-sort">
              <span>Sort</span>
              <select id="command-sort">
                <option value="category">By category</option>
                <option value="name-asc">Name (A–Z)</option>
                <option value="name-desc">Name (Z–A)</option>
                <option value="price-asc">Price (low to high)</option>
                <option value="price-desc">Price (high to low)</option>
              </select>
            </label>
          </div>
          <p class="multiplier-note" id="multiplier-note">Multiplier changes gameplay prices only. Price sorting uses the selected multiplier and treats variable-cost bets and transfers separately.</p>
          <div class="category-row" id="category-row" role="group" aria-label="Command categories">
            <button type="button" class="category-button is-selected" data-category="all" aria-pressed="true">All <span data-count="all"></span></button>
            <button type="button" class="category-button" data-category="gameplay" aria-pressed="false">Gameplay <span data-count="gameplay"></span></button>
            <button type="button" class="category-button" data-category="minigame" aria-pressed="false">Minigames <span data-count="minigame"></span></button>
            <button type="button" class="category-button" data-category="utility" aria-pressed="false">Utility <span data-count="utility"></span></button>
            <button type="button" class="category-button" data-category="streamer" aria-pressed="false">Streamer <span data-count="streamer"></span></button>
          </div>
        </div>

        <div class="result-bar">
          <p id="results-label" role="status" aria-live="polite">Loading commands…</p>
          <button id="clear-filters" class="clear-button" type="button" hidden>Clear filters <span aria-hidden="true">×</span></button>
        </div>
        <div id="command-results" aria-busy="true"></div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">?</div>
          <h3>No commands found</h3>
          <p>Try a different search or remove a filter.</p>
          <button class="primary-link" id="empty-reset" type="button">Show all commands</button>
        </div>
        <div class="empty-state" id="load-error" hidden role="alert">
          <div class="empty-icon" aria-hidden="true">!</div>
          <h3>Couldn't load the command list</h3>
          <p>This page reads TwitchCraft's COMMANDS.md file. Refresh the page or use the source link below.</p>
          <a class="primary-link" href="https://github.com/AntnyGamer/TwitchCraft/blob/main/docs/COMMANDS.md">View commands on GitHub ↗</a>
        </div>
      </section>

      <aside class="how-it-works" aria-labelledby="notes-heading">
        <div>
          <h2 id="notes-heading">Before you use a command</h2>
        </div>
        <div class="note-grid">
          <div class="note"><span class="note-number">1.</span><h3>Replace placeholders</h3><p>Copied syntax is a template. Replace values in <code>&lt;angle brackets&gt;</code>; square brackets indicate optional arguments.</p></div>
          <div class="note"><span class="note-number">2.</span><h3>Costs are defaults</h3><p>The price multiplier above is a preview, not a live connection to a streamer's settings. It affects gameplay command prices only. Multiplayer targeting scales the base cost by <code>(player count + 1) / 2</code> (rounded down), then applies the multiplier (rounded up).</p></div>
          <div class="note"><span class="note-number">3.</span><h3>Some commands are conditional</h3><p>Chicken Run, Number Guess, and Wither Battle commands require an active round; <code>!gambletokens</code> works independently. Some admin commands require local multiplayer.</p></div>
        </div>
        <p class="reward-note"><strong>Token rewards:</strong> If Bit rewards are enabled, 1 Bit earns 1 token. New followers receive a one-time reward of 50 tokens by default, unless the streamer changes the amount. Streamer commands are for the broadcaster and bot, and moderators where enabled.</p>
      </aside>
    </main>

    <footer class="footer">
      <div class="footer-brand"><img class="footer-logo" src="./server-icon.png" width="30" height="30" alt=""><span>TWITCHCRAFT</span></div>
      <p>Independent community project. Not affiliated with Mojang, Microsoft, or Twitch.</p>
      <a href="https://github.com/AntnyGamer/TwitchCraft/blob/main/docs/COMMANDS.md">Command documentation ↗</a>
    </footer>
  </div>
  <div id="copy-status" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
